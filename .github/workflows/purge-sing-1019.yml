name: Purge historical sing-1019 release asset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-sing-1019.yml'
permissions:
  contents: write
jobs:
  delete-one-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact historical asset and delete it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=663174951
          expected='sing-1019-6083b089d91503b2dd6997086a8db8f5a1d46b029f0e3ae50e7849a840e7ca47.apk'
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" --jq .name)"
          test "$actual" = "$expected" || { echo "Refusing to remove unexpected asset: $actual" >&2; exit 1; }
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          echo "Removed release asset: $expected"
