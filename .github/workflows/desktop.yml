name: Build desktop
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml', 'LICENSE', 'NOTICE']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Install desktop dependencies
        run: python -m pip install -r desktop/requirements.txt pytest==9.1.1 pyinstaller==6.22.3
      - name: Test library, recording timebase, export and desktop UI
        run: python -m pytest desktop/tests -q
      - name: Build and launch packaged Windows application
        env:
          DESKTOP_VERSION: 1.0.${{ github.run_number }}
        run: python desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: sing-desktop-windows
          path: |
            build/sing-desktop*-windows-x64.zip
            build/sing-desktop-source.zip
            build/desktop-update.json
            build/desktop/smoke.json
      - name: Publish desktop download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view desktop-preview >/dev/null 2>&1 || gh release create desktop-preview --prerelease --title 'Sing · Windows 桌面版' --notes '适合电脑横屏的原生桌面录歌版本。解压后运行 SingDesktop.exe；录音与设置保存于用户目录，覆盖更新保留数据。'
          gh release upload desktop-preview build/sing-desktop*-windows-x64.zip build/sing-desktop-source.zip --clobber
          gh release upload desktop-preview build/desktop-update.json --clobber
