name: Build APK
on:
  push:
    branches: [main, feature/android-local-spleeter]
    paths-ignore: ['README.md', 'docs/**', 'desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test self-hosted API protocol
        run: |
          python -m pip install -r requirements-build.txt fastapi==0.115.6 httpx==0.28.1 tensorflow-cpu==2.16.2
          python server/test_api.py
      - name: Install audio fixture encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Convert and numerically verify original Spleeter model
        run: |
          python scripts/mobile-model/prepare_model.py
          python scripts/mobile-model/make_android_fixtures.py
      - run: bash tests/run.sh
      - name: Restore fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Configure SING_KEYSTORE_BASE64 in repository Actions Secrets. No replacement key will be generated.' >&2
            exit 1
          fi
          mkdir -p build
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/fixed.jks
      - name: Build compatible update
        env:
          SIGNING_KEYSTORE: build/fixed.jks
          SIGNING_PASSWORD: ${{ secrets.SING_KEYSTORE_PASSWORD || 'android' }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.1.${{ github.run_number }}
        run: |
          export VERSION_CODE=$((VERSION_CODE + 1000))
          OFFLINE_ASSETS=build/mobile-model/assets bash build.sh
          mv build/sing.apk build/sing-offline.apk
          bash build.sh
          bash tests/android/build.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android real codec and model smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tests/android/run.sh
      - name: Remove signing key
        if: always()
        run: rm -f build/fixed.jks
      - name: Prepare versioned APK and update manifest
        run: python scripts/release_metadata.py build/sing.apk
      - name: Package self-hosted server
        run: zip -j build/sing-server.zip server/app.py server/requirements.txt server/Dockerfile server/compose.yaml server/README.md server/test_api.py server/smoke_test.py LICENSE NOTICE licenses/Apache-2.0.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sing-apk
          path: |
            build/sing.apk
            build/sing-offline.apk
            build/mobile-model/assets/spleeter-2stems-fp32.tflite
            build/mobile-model/assets/spleeter-2stems-fp32.json
            build/mobile-model/verification.json
            build/android-tests/result.txt
            build/android-tests/update-result.txt
            build/sing-[0-9]*.apk
            build/update.json
            build/sing-server.zip
      - name: Publish development APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease --title '轻唱 · 最新测试版' --notes '原生轻量 Android APK；人声单独保存。自动构建，真机兼容性请实测。沿用固定签名，可覆盖安装保留数据。'
          gh release upload preview build/sing.apk build/sing-offline.apk build/sing-[0-9]*.apk build/sing-server.zip build/mobile-model/spleeter-2stems-fp32-*.tflite build/mobile-model/assets/spleeter-2stems-fp32.json build/mobile-model/verification.json --clobber
          # Publish metadata last; existing manifests keep pointing to immutable versioned APKs.
          gh release upload preview build/update.json --clobber
          gh release edit preview --title '轻唱 · 手机本地伴奏提取' --notes '新增更多→手机本地提取伴奏。使用与 vocal-separate 相同的原 Spleeter 两轨 FP32 权重，支持 MP3/AAC/M4A/WAV，歌曲无需上传或电脑。普通 sing.apk 首次下载约 75 MB 模型，sing-offline.apk 内含模型可离线安装；以后应用内更新仅下载程序，保留模型、录音和曲库。分离完成自动载入录歌。固定签名覆盖安装。已通过原模型数值回归和 Android 模拟器测试，vivo X100 速度和听感待真机验证。'
