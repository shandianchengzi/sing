name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require private repository for personal credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true || { echo 'Personal builds require a private repository.'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test self-hosted API protocol
        run: |
          python -m pip install -r requirements-build.txt fastapi==0.115.6 httpx==0.28.1
          python server/test_api.py
      - run: bash tests/run.sh
      - name: Restore fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Configure SING_KEYSTORE_BASE64 in repository Actions Secrets. No replacement key will be generated.' >&2
            exit 1
          fi
          mkdir -p build
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/fixed.jks
      - name: Build compatible update
        env:
          PRIVATE_BUILD: '1'
          PRIVATE_REPO_CONFIRMED: '1'
          APPKEY: ${{ secrets.APPKEY }}
          SECRETKEY: ${{ secrets.SECRETKEY }}
          SIGNING_KEYSTORE: build/fixed.jks
          SIGNING_PASSWORD: ${{ secrets.SING_KEYSTORE_PASSWORD || 'android' }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.8.${{ github.run_number }}
        run: |
          export VERSION_CODE=$((VERSION_CODE + 1000))
          bash build.sh
      - name: Remove signing key
        if: always()
        run: rm -f build/fixed.jks
      - name: Prepare versioned APK and update manifest
        run: python scripts/release_metadata.py build/sing.apk
      - name: Package self-hosted server
        run: zip -j build/sing-server.zip server/app.py server/requirements.txt server/Dockerfile server/compose.yaml server/README.md server/test_api.py server/smoke_test.py LICENSE NOTICE licenses/Apache-2.0.txt
      - name: Verify artifacts remain private
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
      - uses: actions/upload-artifact@v4
        with:
          name: sing-apk
          path: |
            build/sing.apk
            build/sing-[0-9]*.apk
            build/update.json
            build/sing-server.zip
      - name: Publish development APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease --title '轻唱 · 最新测试版' --notes '原生轻量 Android APK；人声单独保存。自动构建，真机兼容性请实测。沿用固定签名，可覆盖安装保留数据。'
          gh release upload preview build/sing.apk build/sing-[0-9]*.apk build/sing-server.zip --clobber
          # Publish metadata last; existing manifests keep pointing to immutable versioned APKs.
          gh release upload preview build/update.json --clobber
          gh release edit preview --title '轻唱 · 最新测试版' --notes '个人私用版：百度网盘登录、指定目录曲库、伴奏与 LRC 自动匹配及离线缓存。安装包含个人应用凭据，只供本人使用，不对外分发。固定签名覆盖安装保留数据；私有仓库更新需浏览器登录 GitHub 下载。实际百度账号授权、网盘权限与真机播放需安装后验证。'
