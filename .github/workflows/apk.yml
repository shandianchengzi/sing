name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash tests/run.sh
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sing-apk
          path: build/sing.apk
      - name: Publish development APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease --title '轻唱 · 最新测试版' --notes '原生轻量 Android APK；人声单独保存。自动构建，真机兼容性请实测。使用仓库开发签名。'
          gh release upload preview build/sing.apk --clobber
